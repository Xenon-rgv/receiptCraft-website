<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Paul Receipt Craft</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧾%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: rgba(255, 255, 255, .07);
            --c: rgba(255, 255, 255, .09);
            --t: #f4f1ff;
            --m: #c9bff0;
            --p: #a78bfa;
            --b: rgba(255, 255, 255, .18);
            --w: #fbbf24;
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--t);
            font: 15px/1.55 "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
            background: #0a0620
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(520px circle at 12% 8%, rgba(139, 92, 246, .55), transparent 70%), radial-gradient(560px circle at 88% 14%, rgba(34, 211, 238, .38), transparent 70%), radial-gradient(620px circle at 70% 95%, rgba(244, 63, 94, .38), transparent 70%), #0a0620
        }

        header,
        .card,
        dialog,
        #pvbox,
        #toast {
            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%)
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 10px 18px;
            margin: 10px 12px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .1);
            border: 1px solid var(--b);
            position: sticky;
            top: calc(8px + env(safe-area-inset-top, 0px));
            z-index: 5;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .35)
        }

        .logo {
            font: 700 18px Sora, sans-serif;
            display: flex;
            gap: 9px;
            align-items: center
        }

        .logo i {
            width: 20px;
            height: 26px;
            background: linear-gradient(160deg, #c4b5fd, #22d3ee);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 83% 90%, 66% 100%, 50% 90%, 33% 100%, 16% 90%, 0 100%)
        }

        nav {
            display: flex;
            gap: 4px;
            flex-wrap: wrap
        }

        nav button {
            background: none;
            border: 0;
            color: var(--m);
            padding: 7px 14px;
            border-radius: 99px;
            font: inherit;
            cursor: pointer
        }

        nav button.on {
            background: linear-gradient(135deg, #7c3aed, #c026d3);
            color: #fff;
            box-shadow: 0 4px 16px rgba(192, 38, 211, .45)
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 16px
        }

        .tag {
            color: var(--m);
            font-size: 13px
        }

        .hero h1 {
            font: 700 clamp(28px, 5vw, 44px)/1.1 Sora, sans-serif;
            background: linear-gradient(90deg, #fff, #c4b5fd 50%, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: .2em 0 .1em
        }

        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 10px 36px rgba(0, 0, 0, .3), inset 0 1px 0 rgba(255, 255, 255, .2)
        }

        h1,
        h2,
        h3 {
            font-family: Sora, sans-serif;
            margin: .2em 0 .5em
        }

        h2 {
            font-size: 21px
        }

        h3 {
            font-size: 16px
        }

        label {
            display: block;
            font-size: 12.5px;
            color: var(--m);
            margin: 8px 0 2px
        }

        input,
        select,
        textarea,
        button {
            font: inherit
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--b);
            border-radius: 12px;
            background: rgba(255, 255, 255, .08);
            color: var(--t)
        }

        input::placeholder,
        textarea::placeholder {
            color: #a79bd6
        }

        option {
            background: #1b1240;
            color: #fff
        }

        input[type=checkbox] {
            width: auto;
            accent-color: #c026d3
        }

        input[type=color] {
            padding: 2px;
            height: 36px
        }

        :focus-visible {
            outline: 2px solid #67e8f9;
            outline-offset: 2px
        }

        .btn {
            background: linear-gradient(135deg, #7c3aed, #c026d3);
            color: #fff;
            border: 0;
            padding: 9px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(124, 58, 237, .45);
            transition: transform .15s
        }

        .btn:hover {
            transform: translateY(-1px)
        }

        .btn.g {
            background: rgba(255, 255, 255, .1);
            border: 1px solid var(--b);
            box-shadow: none
        }

        .btn.s {
            padding: 4px 10px;
            font-size: 12.5px
        }

        .btn.d {
            background: #e11d48
        }

        .row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px
        }

        .flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .ed {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px
        }

        @media(max-width:860px) {
            .ed {
                grid-template-columns: 1fr
            }

            .ed.pv #form {
                display: none
            }

            .ed:not(.pv) #pvw {
                display: none
            }
        }

        @media(min-width:861px) {
            .mob {
                display: none
            }
        }

        .item {
            border: 1px solid var(--b);
            border-radius: 14px;
            padding: 10px;
            margin: 8px 0;
            background: rgba(255, 255, 255, .04)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            text-align: left;
            padding: 7px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            font-size: 13.5px
        }

        th {
            color: var(--m)
        }

        td.r,
        th.r {
            text-align: right
        }

        .tw {
            overflow-x: auto
        }

        .pill {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .12);
            border: 1px solid var(--b)
        }

        .stat {
            font: 700 28px Sora, sans-serif;
            color: #67e8f9
        }

        .err {
            color: #fda4af;
            font-size: 13px;
            margin: 6px 0
        }

        #toast {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 10, 50, .85);
            border: 1px solid var(--b);
            color: #fff;
            padding: 10px 18px;
            border-radius: 14px;
            display: none;
            z-index: 20
        }

        dialog {
            border: 1px solid var(--b);
            border-radius: 20px;
            background: rgba(22, 14, 52, .85);
            color: var(--t);
            max-width: min(96vw, 780px);
            width: 100%;
            padding: 16px
        }

        dialog::backdrop {
            background: rgba(5, 2, 20, .55);
            backdrop-filter: blur(6px)
        }

        #pvbox {
            overflow: auto;
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--b);
            border-radius: 16px;
            padding: 14px;
            max-height: 80vh
        }

        .rc {
            background: var(--rb);
            color: var(--rt);
            font-family: var(--rf);
            font-size: var(--rs);
            padding: 26px;
            margin: 0 auto;
            width: var(--rw);
            max-width: 100%;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
            overflow: hidden;
            overflow-wrap: anywhere;
            border-radius: 6px;
            line-height: 1.45
        }

        .rc .band {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: -26px -26px 16px;
            padding: 20px 26px;
            background: linear-gradient(120deg, var(--rp), var(--r2));
            color: var(--ron)
        }

        .rc.mn .band {
            background: none;
            color: var(--rt);
            border-bottom: 3px solid var(--rp)
        }

        .rc .bl {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .rc .bl img {
            max-height: 48px;
            max-width: 130px;
            background: #fff;
            border-radius: 6px;
            padding: 3px
        }

        .rc .mk {
            opacity: .9
        }

        .rc .bn {
            font-size: 1.25em
        }

        .rc .sm {
            font-size: .82em;
            opacity: .85
        }

        .rc .br {
            text-align: right
        }

        .rc .ti {
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase
        }

        .rc .ban {
            border: 2px dashed var(--rp);
            color: var(--rp);
            text-align: center;
            padding: 5px;
            margin: 8px 0;
            font-weight: 700
        }

        .rc .meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            background: var(--rp9)
        }

        .rc .meta span,
        .rc .bx span {
            display: block;
            font-size: .75em;
            opacity: .65
        }

        .rc .stamp {
            justify-self: end;
            border: 2.5px solid;
            border-radius: 8px;
            padding: 3px 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
            transform: rotate(-5deg);
            text-align: center
        }

        .rc .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0
        }

        .rc.thermal .g2 {
            grid-template-columns: 1fr
        }

        .rc .bx {
            border-left: 3px solid var(--rp);
            padding-left: 10px
        }

        .rc table {
            width: 100%;
            border-collapse: collapse
        }

        .rc .it th {
            background: var(--rp);
            color: var(--ron);
            padding: 8px;
            text-align: left;
            font-size: inherit;
            border: 0
        }

        .rc .it th.r,
        .rc .it td.r {
            text-align: right
        }

        .rc .it td {
            padding: 8px;
            font-size: inherit;
            border-bottom: 1px solid rgba(128, 128, 128, .25)
        }

        .rc .it tr:nth-child(even) td {
            background: var(--rp5)
        }

        .rc .tot {
            border-radius: 10px;
            border: 1px solid var(--rp3);
            overflow: hidden
        }

        .rc .tot>div {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            gap: 10px
        }

        .rc .tot .gt {
            background: linear-gradient(120deg, var(--rp), var(--r2));
            color: var(--ron);
            font-size: 1.15em;
            font-weight: 700
        }

        .rc .sig {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            margin-top: 22px
        }

        .rc .sig div {
            border-top: 1px solid currentColor;
            padding-top: 4px;
            min-width: 150px;
            font-size: .8em;
            opacity: .8
        }

        .rc .fn {
            text-align: center;
            margin-top: 14px
        }

        .rc .dc {
            text-align: center;
            font-size: .7em;
            opacity: .55;
            margin-top: 6px
        }

        .rc.thermal .band {
            flex-direction: column;
            text-align: center
        }

        .rc.thermal .br {
            text-align: center
        }

        a.btn {
            text-decoration: none;
            display: inline-block
        }

        #ask {
            max-width: 420px
        }

        #pa {
            display: none
        }

        @media print {
            body:before {
                display: none
            }

            body {
                background: #fff
            }

            body>*:not(#pa) {
                display: none !important
            }

            #pa {
                display: block
            }

            .rc {
                box-shadow: none;
                width: 100%;
                max-width: none;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact
            }

            .rc tr {
                break-inside: avoid
            }
        }
    </style>

 <details class="card"><summary><b>Customize design</b></summary><div class="flex" style="margin:8px 0">${Object.keys(PRE).map(n => `<button class="btn g s" data-pre="${n}">${n}</button>`).join('')}</div><div class="row">${C('pc', 'Accent')}${C('pc2', 'Secondary')}${C('bg', 'Background')}${C('tx', 'Text')}<div><label for="c_font">Font</label><select id="c_font" data-t="font">${Object.keys(FONTS).map(n => `<option ${n === t.font ? 'selected' : ''}>${n}</option>`).join('')}</select></div><div><label for="c_size">Text size</label><input id="c_size" type="number" min="10" max="18" data-t="size" value="${t.size}"></div><div><label for="c_pa">Paper</label><select id="c_pa" data-t="paper">${['A4', 'A5', 'Receipt', 'Thermal'].map(n => `<option ${n === t.paper ? 'selected' : ''}>${n}</option>`).join('')}</select></div><div><label for="c_ly">Layout</label><select id="c_ly" data-t="layout">${['premium', 'minimal', 'thermal'].map(n => `<option ${n === t.layout ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div><div style="margin-top:8px">${sw('logo', 'Logo')}${sw('contact', 'Business contact line')}${sw('cust', 'Customer')}${sw('tax', 'Tax breakdown')}${sw('code', 'Item codes')}${sw('foot', 'Footer')}${sw('qr', 'Verification QR')}${sw('words', 'Amount in words')}${sw('sig', 'Signature lines')}${sw('ship', 'Delivery details')}</div><div id="ct" class="err"></div><h3 style="margin-top:10px">Saved templates</h3><div class="flex"><select id="tp" style="max-width:220px" aria-label="Saved templates"><option value="">Choose a template</option>${PR().tpls.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="btn g s" data-tp="apply">Apply</button><button class="btn g s" data-tp="save">Save current as new</button><button class="btn g s" data-tp="ren">Rename</button><button class="btn g s" data-tp="del">Delete</button><button class="btn g s" data-tp="reset">Reset to default</button></div></details>
 <div id="er" class="err" role="alert"></div><div class="flex"><button class="btn g" id="sd">Save draft</button><button class="btn" id="is">Issue receipt</button><button class="btn" id="dl">Download PDF</button><button class="btn g" id="pr">Print</button></div></div>
 <div id="pvw"><div class="flex" style="margin-bottom:6px"><label style="margin:0">Zoom</label><input type="range" id="zm" min="50" max="130" value="100" style="max-width:160px"></div><div id="pvbox"><div id="pv"></div></div></div></div>`;
            items(); pv(); const form = $('#form');
            form.oninput = form.onchange = e => {
                if (e.target.id === 'cf') { V.cf = e.target.value; items(); return } const d = e.target.dataset; if (d.i !== undefined) { cur.items[d.i][d.f] = e.target.value; if (d.f === 'n' && e.type === 'change') { const c = PR().cat.find(x => x.n && x.n === e.target.value); if (c) { Object.assign(cur.items[d.i], { p: c.p, c: c.c, desc: c.desc }); items() } } } else if (d.k) {
                    const v = e.target.type === 'checkbox' ? e.target.checked : e.target.value; if (d.k === 'inc' || d.k === 'ps' || d.k === 'odT' || d.k.includes('.') || true) { const p = d.k.split('.'); let o = cur; while (p.length > 1) o = o[p.shift()]; o[p[0]] = v }
                    if (d.k === 'ps') { if (v === 'paid') $('#f_pd').value = cur.paid = (calc(cur).total / 100).toFixed(2); if (v === 'unpaid') $('#f_pd').value = cur.paid = '' }
                }
                else if (d.t) { const p = d.t.split('.'); let o = S.tpl; while (p.length > 1) o = o[p.shift()]; o[p[0]] = e.target.type === 'checkbox' ? +e.target.checked : e.target.type === 'number' ? +e.target.value : e.target.value; save() } pv()
            };
            form.onclick = e => { const d = e.target.dataset; const qb = e.target.closest('[data-qa]'); if (qb) return addQ(+qb.dataset.qa); if (d.tp) return tpAct(d.tp); if (d.pre) { const p = PRE[d.pre];[S.tpl.pc, S.tpl.bg, S.tpl.tx, S.tpl.pc2] = p; save(); V.new(); $('#form details').open = true } if (d.pick !== undefined) { const x = S.receipts.slice().reverse().find(x => x.cust.name === d.pick); cur.cust = clone(x.cust); V.new() } };
            $('#add').onclick = () => { cur.items.push({ n: '', d: '0', desc: '', c: '', q: '1', p: '' }); items(); pv() };
            $('#zm').oninput = e => { $('#pv').style.zoom = e.target.value / 100 };
            const sv = iss => {
                const er = [], k = calc(cur); cur.b = { cur: S.biz.cur, taxRate: S.biz.taxRate, taxName: S.biz.taxName }; if (!cur.no.trim()) er.push('Enter a receipt number.'); if (S.receipts.some(x => x.no === cur.no && x.id !== cur.id)) er.push('That receipt number is already used. Pick another.');
                if (iss) { if (!cur.items.some(i => i.n.trim() && toC(i.p) > 0)) er.push('Add at least one item with a name and price.'); if (cur.ps === 'paid' && k.paid < k.total) er.push('Status is Paid but the amount paid is less than the total. Change the status or the amount.'); if (cur.ps === 'partial' && !(k.paid > 0 && k.paid < k.total)) er.push('Partially paid needs an amount above 0 and below the total.'); if (cur.ps === 'unpaid' && k.paid > 0) er.push('Unpaid receipts cannot have an amount paid.'); if (k.paid > k.total) er.push('Amount paid is more than the total.') }
                $('#er').innerHTML = er.map(esc).join('<br>'); if (er.length) return; cur.state = iss ? 'issued' : 'draft'; cur.ts = cur.ts || Date.now(); if (iss && !cur.vc) cur.vc = uid() + uid() + uid(); const i = S.receipts.findIndex(x => x.id === cur.id); if (i >= 0) S.receipts[i] = clone(cur); else S.receipts.push(clone(cur)); log(iss ? 'Issued' : 'Draft saved', cur.no); if (save()) { toast(iss ? 'Receipt issued. Print or save it as PDF.' : 'Draft saved.'); if (iss) { view(S.receipts.find(x => x.id === cur.id)); cur = null; go('list') } }
            };
            $('#sd').onclick = () => sv(0); $('#is').onclick = () => sv(1); $('#pr').onclick = () => printR(cur); $('#dl').onclick = e => pdfR(cur, e.target);
            if (locked) toast('Issued receipts are locked. Duplicate to make a corrected one.')
        }
        function items() { $('#items').innerHTML = cur.items.map((i, n) => `<div class="item"><div class="row"><div><label for="i${n}n">Item name</label><input id="i${n}n" data-i="${n}" data-f="n" list="catl" value="${esc(i.n)}"></div><div><label for="i${n}q">Qty</label><input id="i${n}q" type="number" min="0" step="any" data-i="${n}" data-f="q" value="${esc(i.q)}"></div><div><label for="i${n}p">Unit price</label><input id="i${n}p" type="number" min="0" step="0.01" data-i="${n}" data-f="p" value="${esc(i.p)}"></div><div><label for="i${n}d">Discount %</label><input id="i${n}d" type="number" min="0" max="100" data-i="${n}" data-f="d" value="${esc(i.d)}"></div></div><div class="row"><div><label for="i${n}s">Description</label><input id="i${n}s" data-i="${n}" data-f="desc" value="${esc(i.desc)}"></div><div><label for="i${n}c">SKU / code</label><input id="i${n}c" data-i="${n}" data-f="c" value="${esc(i.c)}"></div></div><div class="flex" style="margin-top:6px"><button class="btn g s" onclick="mv(${n},-1)" aria-label="Move up">↑</button><button class="btn g s" onclick="mv(${n},1)" aria-label="Move down">↓</button><button class="btn g s" onclick="cur.items.splice(${n}+1,0,clone(cur.items[${n}]));items();pv()">Duplicate</button><button class="btn g s" onclick="if(cur.items.length>1){cur.items.splice(${n},1);items();pv()}">Remove</button></div></div>`).join('') + '<datalist id="catl">' + PR().cat.filter(c => !V.cf || c.k === V.cf).map(c => `<option value="${esc(c.n)}" label="${esc(c.k || '')}">`).join('') + '</datalist>'; qa() }
        function mv(n, d) { const j = n + d; if (j < 0 || j >= cur.items.length) return;[cur.items[n], cur.items[j]] = [cur.items[j], cur.items[n]]; items(); pv() }
        function pv() { const k = calc(cur), f = x => fmt(x, S.biz.cur); $('#pv').innerHTML = rcpt(cur); $('#sum').textContent = `Total ${f(k.total)} · Paid ${f(k.paid)} · Balance ${f(k.bal)}`; const lum = h => { const c = [1, 3, 5].map(i => { let v = parseInt(h.substr(i, 2), 16) / 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4 }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2] }, ct = (Math.max(lum(S.tpl.tx), lum(S.tpl.bg)) + .05) / (Math.min(lum(S.tpl.tx), lum(S.tpl.bg)) + .05), ca = (Math.max(lum(S.tpl.pc), lum(S.tpl.bg)) + .05) / (Math.min(lum(S.tpl.pc), lum(S.tpl.bg)) + .05); if ($('#ct')) $('#ct').textContent = ct < 4.5 ? 'Text and background contrast is low. Choose colors that are easier to read.' : ca < 3 ? 'Accent color is hard to see on this background.' : '' }
        const vm = (location.hash + location.search).match(/verify=([a-z0-9]+)/i); if (vm) V.code = vm[1];
        go(vm ? 'ver' : 'dash'); cloudInit().then(() => { hdr(); if (['dash', 'list', 'cust', 'cat', 'ver'].includes(view_)) go(view_); else if (view_ === 'new') { cur = null; go('dash') } });
    </script>
